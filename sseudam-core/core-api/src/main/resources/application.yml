spring.application.name: sseudam-server
spring.profiles.active: ${SPRING_PROFILES_ACTIVE:local}

spring:
  threads:
    virtual:
      enabled: true
  modulith:
    events:
      completion-mode: update
    metrics:
      enabled: false
  config:
    import:
      - db-core.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
      - authentication.yml
      - oauth.yml
      - swagger.yml
      - rsa.yml
      - aws.yml
      - notification.yml
  web.resources.add-mappings: false

server:
  shutdown: graceful
  tomcat:
    max-connections: 20000
    threads:
      max: 600
      min-spare: 100
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring.lifecycle.timeout-per-shutdown-phase: 30s
