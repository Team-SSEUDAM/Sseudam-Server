                    }
components:
  schemas:
    TrashSpotDetailsResponse:
      title: TrashSpotDetailsResponse
      type: object
      properties:
        visitedCount:
          type: number
          description: 방문 횟수
        trashType:
          type: string
          description: 쓰레기통 유형
        address:
          type: object
          properties:
            site:
              type: string
              description: 상세 주소
            city:
              type: string
              description: 도시
          description: 주소 정보
        imageUrl:
          type: string
          description: 이미지 URL
        name:
          type: string
          description: 쓰레기통 장소명
        lastVisitedAt:
          type: string
          description: 최근 방문 시간
        suggestionerId:
          type: number
          description: 제보자 ID
        id:
          type: number
          description: 쓰레기통 장소 ID
        region:
          type: string
          description: 지역
        point:
          type: object
          properties:
            coordinates:
              type: array
              description: 좌표 배열
              items:
                oneOf:
                - type: object
                - type: boolean
                - type: string
                - type: number
            type:
              type: string
              description: 좌표 타입
          description: 좌표 정보
        suggestionerName:
          type: string
          description: 제보자 이름
        updatedAt:
          type: string
          description: 수정 시간
    TrashSpotAllResponse:
      title: TrashSpotAllResponse
      type: object
      properties:
        list:
          type: array
          description: 쓰레기통 장소 목록
          items:
            type: object
            properties:
              trashType:
                type: string
                description: 쓰레기통 유형
              address:
                type: object
                properties:
                  site:
                    type: string
                    description: 상세 주소
                  city:
                    type: string
                    description: 도시
                description: 주소 정보
              name:
                type: string
                description: 쓰레기통 장소명
              id:
                type: number
                description: 쓰레기통 장소 ID
              region:
                type: string
                description: 지역
              point:
                type: object
                properties:
                  coordinates:
                    type: array
                    description: 좌표 배열
                    items:
                      oneOf:
                      - type: object
                      - type: boolean
                      - type: string
                      - type: number
                  type:
                    type: string
                    description: 좌표 타입
                description: 좌표 정보
              updatedAt:
                type: string
                description: 수정 시간
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - Authorization: []