spring:
  cache:
    type: redis
  profiles:
    active: local

core:
  storage:
    redis:
      host: localhost
      port: 6379
---
spring:
  config:
    activate:
      on-profile: dev
core:
  storage:
    redis:
      host: localhost
      port: 6379
---
spring:
  config:
    activate:
      on-profile: prod
core:
  storage:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
